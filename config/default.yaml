# Input:  design doc §3.1-3.4 四大模块参数定义
# Output: 被提醒脚本 (sedentary.sh 等) 读取的默认配置值
# Pos:    config/default.yaml — 用户配置的默认模板，可被 ~/.vanilla-health/config.yaml 覆盖
#
# 一旦我被修改，请更新我的头部注释，以及所属文件夹的 README.md。

# ============================================================
# 香草健康管理 — 默认配置
# 用户可通过 ~/.vanilla-health/config.yaml 覆盖任意字段
# ============================================================

# --- 久坐提醒 (health-sedentary) ---
# 证据: SD3 (Yin 2024), SD4 (Dunstan 2012), SD7 (EU-OSHA 2022)
health-sedentary:
  enabled: true
  interval_minutes: 30           # 提醒间隔，可调范围 25-60，步进 5
  min_break_seconds: 120         # 最低中断时长，可调范围 60-600，步进 60
  hard_limit_minutes: 120        # 连续久坐硬上限（不可逾越）
  daily_stand_target_minutes: 120 # 每日站立/活动目标
  do_not_disturb: []             # 免打扰时段，格式 "HH:MM-HH:MM"
  message_level: "spark"         # signal | spark | facilitator

# --- 用眼提醒 (health-eye-care) ---
# 证据: EC4 (Johnson & Rosenfield 2023), DR1 (Kleitman), DR2 (WU Vienna)
health-eye-care:
  enabled: true
  interval_minutes: 50           # 提醒间隔，可选 25/45/50/90
  break_seconds: 60              # 休息时长，可选 30/60/90
  view_distance_m: 6             # 远眺距离（米），约 20 英尺
  blink_count: 15                # 有意识眨眼次数
  do_not_disturb: []

# --- 喝水提醒 (health-hydration) ---
# 证据: HD1 (NASEM), HD2 (EFSA), HD3 (中国营养学会), HD12 (Mudie 2014)
health-hydration:
  enabled: true
  interval_minutes: 75           # 提醒间隔，可调范围 60-90
  target_per_drink_ml: 200       # 单次目标量 (mL)，可调范围 150-250
  daily_target_ml: 2000          # 每日总目标 (mL)，男性 2000 女性 1600
  start_time: "09:00"            # 提醒开始时间
  end_time: "18:00"              # 提醒结束时间
  do_not_disturb: []

# --- 提肛锻炼提醒 (health-kegel) ---
# 证据: KG1 (Cochrane 2024), KG2 (NIH/NIDDK), KG3 (Cleveland Clinic)
health-kegel:
  enabled: true
  reminders_per_day: 3           # 每日提醒次数，可调范围 2-3
  stage: "beginner"              # beginner | transition | standard | advanced
  sets_per_session: 3            # 每次训练组数
  reps_per_set: 10               # 每组次数，可调范围 5-15
  hold_seconds: 3                # 保持秒数，可调范围 3-10
  rest_seconds: 3                # 休息秒数，保持/休息比 1:1
  privacy_mode: true             # 隐私模式：含蓄文案
  leaderboard_enabled: false     # 是否参与打榜，init 时询问
  do_not_disturb:                # 免打扰时段
    - "22:00-07:00"

# --- 打榜 PK 系统 (health-leaderboard) ---
health-leaderboard:
  enabled: false                 # 默认关闭，需用户主动开启
  opt_in_leaderboard: false      # 是否出现在公开排行榜
  display_name: "匿名战士"        # 排行榜显示名称
  api_base_url: "https://api.vanilla-health.dev"

# ═══════════════════════════════════════════════════════════════
# 调度守护设置（scheduler.sh 使用）
# ═══════════════════════════════════════════════════════════════
daemon:
  tick_seconds: 10
  crash_recovery: true

# ═══════════════════════════════════════════════════════════════
# 心流适配 — 设计文档 §5.5
# ═══════════════════════════════════════════════════════════════
flow:
  enabled: true
  method: process_heuristic
  high_focus_apps:
    - Xcode
    - Terminal
    - iTerm2
    - IntelliJ IDEA
    - VSCode
    - Sublime Text
    - Vim
    - Emacs
  levels:
    none:    { delay_multiplier: 1.0, style: normal }
    light:   { delay_multiplier: 1.5, style: normal }
    medium:  { delay_multiplier: 2.5, style: gentle }
    deep:    { delay_multiplier: 4.0, style: subtle }

# ═══════════════════════════════════════════════════════════════
# 多 Channel 配置 — 设计文档 §5.6
# ═══════════════════════════════════════════════════════════════
channels:
  desktop_notification: true
  terminal_echo:        true
  tts:                  false
  log_only:             true

# ═══════════════════════════════════════════════════════════════
# 智能抑制规则 — 设计文档 §5.3
# ═══════════════════════════════════════════════════════════════
suppression:
  quiet_hours:    { enabled: true, start: "23:00", end: "07:00", policy: log_only }
  meeting:        { enabled: true, policy: silent }
  screen_locked:  { enabled: true, policy: pause }
  user_idle:      { enabled: true, idle_threshold_seconds: 300, policy: pause }

# ═══════════════════════════════════════════════════════════════
# 自适应引擎 — 设计文档 §5.7
# ═══════════════════════════════════════════════════════════════
adaptive:
  enabled: true
  initial_score: 50
  score_min: 0
  score_max: 100
  points:
    completed: 10
    dismissed: -5
    snoozed: -3
  tiers:
    - { score_min: 0,  score_max: 30, multiplier: 1.5 }
    - { score_min: 30, score_max: 60, multiplier: 1.0 }
    - { score_min: 60, score_max: 80, multiplier: 0.8 }
    - { score_min: 80, score_max: 100, multiplier: 0.6 }

# ── 提肛锻炼提醒模块 ──
health-kegel:
  gender: neutral
  start_date: "2026-06-08"
  reminder_times: "09:00,13:00,20:00"
  leaderboard_enabled: false
