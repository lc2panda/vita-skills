name = "vita-leaderboard"
main = "src/index.ts"
compatibility_date = "2025-06-08"

# ============================================
# D1 数据库配置
# 执行 `npx wrangler d1 create vita-leaderboard-db` 获取 database_id
# 将输出的 database_id 替换下方的占位符
# ============================================
[[d1_databases]]
binding = "DB"
database_name = "vita-leaderboard-db"
database_id = "bb7d4268-af7c-4cbc-9b2d-23fa8cefd848"

# ============================================
# KV 命名空间（用于速率限制缓存）
# 执行 `npx wrangler kv:namespace create vita-cache` 获取 id
# ============================================
[[kv_namespaces]]
binding = "KV_CACHE"
id = "YOUR_KV_ID_HERE"  # ← 替换为实际 KV id

# ============================================
# 定时任务（每天凌晨1:00 UTC 聚合统计）
# ============================================
[triggers]
crons = ["0 1 * * *"]

# ============================================
# 静态站点（排行榜前端）
# ============================================
[site]
bucket = "./src/frontend"

# ============================================
# 数据库迁移
# ============================================
[[migrations]]
tag = "v1"
new_classes = []
